name: Sync Fork with Upstream

on:
  schedule:
    # Executa automaticamente a cada 2 horas
    - cron: '0 */2 * * *'
  workflow_dispatch: # Permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do seu fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar com sven-n/MuMain (main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/sven-n/MuMain.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit
          git push origin main
